<svg xmlns="http://www.w3.org/2000/svg" width="720" height="460" viewBox="0 0 720 460" role="img" aria-label="dots syncing both repos">
  <rect width="720" height="460" rx="12" fill="#0d1117" stroke="#30363d"/>
  <circle cx="24" cy="22" r="6" fill="#ff5f57"/>
  <circle cx="44" cy="22" r="6" fill="#febc2e"/>
  <circle cx="64" cy="22" r="6" fill="#28c840"/>
  <text x="88" y="27" fill="#8b949e" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13">dots</text>
  <text x="28" y="68" fill="#e6edf3" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15" font-weight="650">dots</text>
  <text x="28" y="90" fill="#8b949e" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13">pull, apply, and push both repos</text>
  <text x="28" y="132" fill="#8b949e" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13">───  capture</text>
  <text x="28" y="156" fill="#3fb950" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14">✓</text>
  <text x="52" y="156" fill="#e6edf3" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14">public  nothing to commit</text>
  <text x="28" y="192" fill="#8b949e" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13">───  commit</text>
  <text x="28" y="216" fill="#3fb950" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14">✓</text>
  <text x="52" y="216" fill="#e6edf3" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14">private  committed</text>
  <text x="28" y="252" fill="#8b949e" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13">───  pull</text>
  <text x="28" y="276" fill="#3fb950" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14">✓</text>
  <text x="52" y="276" fill="#e6edf3" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14">pulled</text>
  <text x="28" y="312" fill="#8b949e" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13">───  apply</text>
  <text x="28" y="336" fill="#3fb950" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14">✓</text>
  <text x="52" y="336" fill="#e6edf3" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14">applied</text>
  <text x="28" y="372" fill="#8b949e" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13">───  push</text>
  <text x="28" y="396" fill="#3fb950" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14">✓</text>
  <text x="52" y="396" fill="#e6edf3" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14">pushed</text>
</svg>
