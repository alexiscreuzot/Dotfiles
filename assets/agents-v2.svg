<svg xmlns="http://www.w3.org/2000/svg" width="760" height="280" viewBox="0 0 760 280" role="img" aria-label="Agent files linked from the private repo and synced by dots">
  <rect width="760" height="280" rx="12" fill="#0d1117" stroke="#30363d"/>
  <circle cx="24" cy="22" r="6" fill="#ff5f57"/>
  <circle cx="44" cy="22" r="6" fill="#febc2e"/>
  <circle cx="64" cy="22" r="6" fill="#28c840"/>
  <text x="88" y="27" fill="#8b949e" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13">agents</text>

  <text x="28" y="68" fill="#e6edf3" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15" font-weight="650">agents on every Mac</text>
  <text x="28" y="90" fill="#8b949e" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13">one folder, linked into place, synced by dots</text>

  <path d="M340 160H438" stroke="#30363d" stroke-width="2" fill="none"/>
  <path d="m428 154 10 6-10 6z" fill="#8b949e"/>
  <text x="389" y="150" fill="#8b949e" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" text-anchor="middle">symlink</text>

  <g fill="#161b22" stroke="#30363d">
    <rect x="28" y="116" width="312" height="88" rx="8"/>
    <rect x="448" y="116" width="284" height="88" rx="8"/>
  </g>

  <g fill="#3fb950" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="650">
    <text x="44" y="144">AGENTS</text>
    <text x="464" y="144">LINKED</text>
  </g>

  <g fill="#e6edf3" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13">
    <text x="44" y="170">~/.dotfiles-private/agents</text>
    <text x="464" y="170">~/.cursor · ~/.agents</text>
  </g>
  <g fill="#8b949e" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13">
    <text x="44" y="188">skills · rules · commands</text>
    <text x="464" y="188">edits land in the repo</text>
  </g>

  <text x="28" y="246" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13"><tspan fill="#3fb950">dots</tspan><tspan fill="#8b949e"> → GitHub → every Mac</tspan></text>
</svg>
